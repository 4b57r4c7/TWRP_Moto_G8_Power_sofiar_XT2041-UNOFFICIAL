name: Build TWRP - sofiar

on:
  workflow_dispatch:   # ръчно стартиране от Actions таба в GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350   # GitHub Actions free tier лимит е 360 min/job
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Преди чистене ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "=== След чистене ==="
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 bc rsync bc \
            liblz4-tool libssl-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Repo init (TWRP AOSP minimal manifest, shallow)
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Add local manifest (device tree + kernel)
        run: |
          mkdir -p ~/twrp/.repo/local_manifests
          cp "$GITHUB_WORKSPACE/local_manifest.xml" ~/twrp/.repo/local_manifests/roomservice.xml

      - name: Repo sync
        run: |
          cd ~/twrp
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h

      - name: Patch kernel vmscan compatibility
        run: |
          python3 "$GITHUB_WORKSPACE/tools/patch_vmscan.py" ~/twrp/kernel/motorola/trinket/mm/vmscan.c

      - name: Patch kernel cpufreq_stats compatibility
        run: |
          python3 "$GITHUB_WORKSPACE/tools/patch_cpufreq_stats.py" ~/twrp/kernel/motorola/trinket/drivers/cpufreq/cpufreq_stats.c

      - name: Patch kernel sde_connector compatibility
        run: |
          python3 "$GITHUB_WORKSPACE/tools/patch_sde_connector.py" ~/twrp/kernel/motorola/trinket/drivers/gpu/drm/msm/sde/sde_connector.c

      - name: Debug - inspect smb5-reg.h for TYPE_C register conventions
        run: |
          REG_H=~/twrp/kernel/motorola/trinket/drivers/power/supply/qcom/smb5-reg.h
          echo "=== TYPEC_BASE дефиниция ==="
          grep -n "TYPEC_BASE" "$REG_H" || echo "(не намерен)"
          echo ""
          echo "=== Всички TYPE_C / TYPEC регистри в smb5-reg.h ==="
          grep -n "TYPE_C\|TYPEC" "$REG_H" || echo "(нищо намерено)"
          echo ""
          echo "=== Контекст около DEBUG_ACCESS (ако съществува частично) ==="
          grep -n -B2 -A2 "DEBUG_ACCESS" "$REG_H" || echo "(нищо намерено)"

      - name: Copy in device tree
        run: |
          mkdir -p ~/twrp/device/motorola/sofiar
          cp -rv "$GITHUB_WORKSPACE/device_motorola_sofiar/." ~/twrp/device/motorola/sofiar/
          echo "=== Съдържание на device/motorola/sofiar ==="
          find ~/twrp/device/motorola/sofiar -type f

      - name: Workaround - remove duplicate Soong module in common tree
        run: |
          # bootctrl/1.1/impl/Android.bp дублира дефиниция на
          # "android.hardware.boot@1.1-impl-qti", вече дефиниран в
          # bootctrl/Android.bp (по-горе в йерархията) - Soong не
          # позволява две дефиниции със същото име. Махаме само
          # дублиращия Android.bp, не цялата директория (source
          # файловете вътре остават достъпни ако горният модул ги
          # референсва по относителен път).
          DUP_FILE=~/twrp/device/motorola/sm6125-common/bootctrl/1.1/impl/Android.bp
          if [ -f "$DUP_FILE" ]; then
            rm -v "$DUP_FILE"
          else
            echo "Файлът вече не съществува на този път - провери дали проблемът е решен по друг начин."
          fi

          # PRODUCT_COPY_FILES редът в common.mk за
          # android.hardware.gatekeeper@1.0.so се сблъсква с
          # автоматично компилираната Soong hidl_interface библиотека
          # (hardware/interfaces/gatekeeper/1.0/Android.bp, name:
          # "android.hardware.gatekeeper@1.0") - двете се целят в
          # СЪЩИЯ изходен път. Изтриването на source файла не помогна
          # (самият PRODUCT_COPY_FILES ред регистрира Make правилото
          # независимо от съществуването на файла) - маха се самия ред.
          COMMON_MK=~/twrp/device/motorola/sm6125-common/common.mk
          if [ -f "$COMMON_MK" ]; then
            # COMMON_PATH се ползва навсякъде в common.mk
            # ($(COMMON_PATH)/recovery/root/...) но никога не е
            # дефинирана във файла - резолюира се до празен низ,
            # което чупи ВСИЧКИ PRODUCT_COPY_FILES source пътища
            # (ninja грешка: "missing and no known rule to make it"
            # за литерален "/recovery/root/..." път без директория
            # отпред). Добавяме дефиницията в самото начало.
            sed -i '1i COMMON_PATH := device/motorola/sm6125-common' "$COMMON_MK"

            sed -i '\|android\.hardware\.gatekeeper@1\.0\.so:recovery/root/system/lib64/android\.hardware\.gatekeeper@1\.0\.so|d' "$COMMON_MK"
            # Същия клас конфликт, сега за keymaster@4.0.so - HIDL
            # библиотеката се компилира автоматично от
            # hardware/interfaces/keymaster/4.0/, PRODUCT_COPY_FILES
            # редът тук се сблъсква на същия изходен път.
            sed -i '\|android\.hardware\.keymaster@4\.0\.so:recovery/root/system/lib64/android\.hardware\.keymaster@4\.0\.so|d' "$COMMON_MK"
            # ICU библиотеките (libandroidicu/libicui18n/libicuuc) са
            # стандартни AOSP системни библиотеки без hardware-специфика -
            # AOSP build системата ги компилира сама наред с всичко
            # останало, prebuilt копията в common.mk се сблъскват по
            # същата причина като gatekeeper/keymaster по-горе.
            sed -i '\|libandroidicu\.so:recovery/root/system/lib64/libandroidicu\.so|d' "$COMMON_MK"
            sed -i '\|libicui18n\.so:recovery/root/system/lib64/libicui18n\.so|d' "$COMMON_MK"
            sed -i '\|libicuuc\.so:recovery/root/system/lib64/libicuuc\.so|d' "$COMMON_MK"
            echo "Редове за gatekeeper/keymaster/ICU премахнати от common.mk. Проверка:"
            grep -n "gatekeeper@1.0.so:recovery/root/system/lib64\|keymaster@4.0.so:recovery/root/system/lib64\|libandroidicu.so:recovery\|libicui18n.so:recovery\|libicuuc.so:recovery" "$COMMON_MK" || echo "(няма повече такива редове)"
          else
            echo "common.mk не намерен на този път!"
          fi

          # bootctrl/Android.mk дефинира bootctrl.trinket ДВА ПЪТИ -
          # веднъж като shared library, веднъж като static library.
          # Обикновено такъв патерн е ОК в AOSP, но в тази TWRP
          # build/make версия причинява "already defined" конфликт.
          # HAL модули обичайно се зареждат динамично (dlopen), затова
          # static варианта е вероятно излишен - маха се той, оставя
          # се само shared library блока.
          BOOTCTRL_MK=~/twrp/device/motorola/sm6125-common/bootctrl/Android.mk
          if [ -f "$BOOTCTRL_MK" ]; then
            sed -i '/include \$(BUILD_SHARED_LIBRARY)/,/include \$(BUILD_STATIC_LIBRARY)/{/include \$(BUILD_SHARED_LIBRARY)/!d}' "$BOOTCTRL_MK"
            echo "Static library блок премахнат от bootctrl/Android.mk. Резултат:"
            cat "$BOOTCTRL_MK"
          else
            echo "bootctrl/Android.mk не намерен на този път!"
          fi

          # Открихме, че освен bootctrl/Android.mk (Kati/Make style),
          # има и ОТДЕЛЕН bootctrl/Android.bp (Soong) в СЪЩАТА папка -
          # вероятно дефинира модул със същото име "bootctrl.trinket".
          # Затова премахването на static блока в Android.mk не помогна -
          # истинският конфликт е Soong срещу Make дефиниция, не двата
          # блока вътре в Android.mk. Махаме Android.bp, оставяме
          # работещия Android.mk.
          BOOTCTRL_BP=~/twrp/device/motorola/sm6125-common/bootctrl/Android.bp
          if [ -f "$BOOTCTRL_BP" ]; then
            echo "=== Съдържание на bootctrl/Android.bp преди изтриване ==="
            cat "$BOOTCTRL_BP"
            rm -v "$BOOTCTRL_BP"
          else
            echo "bootctrl/Android.bp не намерен на този път!"
          fi

          # Стар kernel source (scripts/dtc) генерира tentative
          # definitions (yylloc) в flex/bison изхода по начин, който
          # старият GNU ld мълчаливо сливаше, но модерният lld linker
          # (използван от съвременния AOSP prebuilt clang toolchain)
          # третира като хард "duplicate symbol" грешка. Стандартен
          # фикс: -fcommon връща старото поведение за host tools.
          DTC_MK=~/twrp/kernel/motorola/trinket/scripts/dtc/Makefile
          if [ -f "$DTC_MK" ]; then
            sed -i '1i HOST_EXTRACFLAGS += -fcommon' "$DTC_MK"
            echo "Добавен -fcommon в scripts/dtc/Makefile"
          else
            echo "scripts/dtc/Makefile не намерен на този път!"
          fi

      - name: Build recovery image
        run: |
          set -o pipefail
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_sofiar-eng
          mka recoveryimage 2>&1 | tee build.log

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-sofiar-recovery
          path: |
            ~/twrp/out/target/product/sofiar/recovery.img
          if-no-files-found: warn

      - name: Upload build log (за диагностика ако падне)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/twrp/build.log
          if-no-files-found: ignore
